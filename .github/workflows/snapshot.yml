# Keeps the offline fallback (snapshot.js) fresh. Runs weekly, rebuilds it from
# the live OpenRouter catalog with the same filter the page uses, and commits
# only when the model data actually changed. Run it by hand from the Actions tab.
name: Refresh offline snapshot

on:
  schedule:
    - cron: "0 6 * * 1"     # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/build-snapshot.mjs
      - run: npm test
      - name: Commit if changed
        run: |
          if git diff --quiet -- snapshot.js; then
            echo "snapshot.js unchanged — nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snapshot.js
          git commit -m "Refresh offline snapshot ($(date -u +%F))"
          git push
